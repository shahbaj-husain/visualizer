<style>

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.nd.bad{fill:var(--bad)}.nd.ok{fill:var(--ok)}.nd.cur{fill:var(--ac)}.tx.bad,.tx.cur{fill:var(--bg)}.tx.ok{fill:#fff}

@media(pointer:coarse){button,.sel{min-height:44px}svg[data-dg] .nd{r:21px}}
@media(min-width:900px){#app{max-width:760px}}

<meta name="theme-color" content="#185FA5"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<main id="app">
<header class="r hd"><h1 style="margin:0;flex:1">DSTL Visualizer <small class="m"></small></h1><button id="am" onclick="showHome()" hidden>All modules</button><button id="ins" hidden onclick="ip&&ip.prompt()">Install app</button><button id="tg" onclick="theme()">Dark mode</button></header>
<div id="home"></div>
<section id="mod" hidden>
<h2 id="mt"></h2>
<div id="pz" class="r"></div>
<div id="inp"></div>
<div id="gx" class="cv" hidden><div class="r"><button class="on" data-t="n" onclick="gTool('n')">Add node</button><button data-t="e" onclick="gTool('e')">Add / remove edge</button><button data-t="d" onclick="gTool('d')">Delete</button></div><svg id="gs2" viewBox="0 0 340 240" width="100%" style="touch-action:none;display:block"></svg><p class="m">Tap empty space to add a node. In edge mode tap two nodes. Drag a node to move it.</p></div>

<script>
const $=x=>document.getElementById(x);
let S=[],i=0,rd=null,tm=0,cur=[],n=4,md='avl',pi=-1,AN=null,gen=0,ST=null;
let SP=1;const TQ=new Set(),RQ=new Set();
const wait=ms=>new Promise(r=>{const o={r};o.id=setTimeout(()=>{TQ.delete(o);r()},ms/SP);TQ.add(o)});
function killAnim(){TQ.forEach(o=>{clearTimeout(o.id);o.r()});TQ.clear();RQ.forEach(o=>{cancelAnimationFrame(o.id);o.r()});RQ.clear()}
function chain(k){return Array.from({length:k},(_,a)=>Array.from({length:k},(_,b)=>b==a+1?1:0))}
let M=chain(4);
function load(s,r){halt();S=s;rd=r;i=0;pi=-1;ST=null;draw()}
function draw(){const d=S[i],fw=pi>=0&&i==pi+1;pi=i;gen++;AN=Promise.resolve(rd(d,fw)||wait(1100));$('nt').textContent=d.note;$('ct').textContent=(i+1)+' / '+S.length;$('sl').max=S.length-1;$('sl').value=i}
function go(k){if(!S.length)return;i=Math.max(0,Math.min(S.length-1,k));draw()}
function halt(){tm=0;$('pb').textContent='Play'}
async function tp(){if(tm){halt();return}if(S.length<2)return;if(i>=S.length-1)i=0;tm=1;$('pb').textContent='Pause';draw();
while(tm&&i<S.length-1){await AN;await wait(500);if(!tm)break;go(i+1)}
halt()}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tw(ms,my,fn){const t0=performance.now();ms=RM?1:ms/SP;return new Promise(res=>{(function f(t){if(my!=gen){res();return}const q=Math.min(1,(t-t0)/ms);fn(q<.5?2*q*q:1-(-2*q+2)**2/2);q<1?requestAnimationFrame(f):res()})(t0)})}
function stage(w,h){$('vw').innerHTML=`<svg width="100%" viewBox="0 0 ${w} ${h}"><g id="eg"></g><g id="ng"></g><circle id="tk" r="8" class="tk" cx="0" cy="0" style="opacity:0"/></svg>`;ST={p:{},el:{},ed:{}}}
function sync(ids,ed,cls,lab,from){
for(const k in ST.el)if(!ids.includes(k)){ST.el[k].remove();delete ST.el[k];delete ST.p[k]}
const ks=ed.map(e=>e.join('|'));
for(const k in ST.ed)if(!ks.includes(k)){ST.ed[k].remove();delete ST.ed[k]}
ks.forEach(k=>{if(!ST.ed[k]){$('eg').insertAdjacentHTML('beforeend','<line stroke-width="2"/>');ST.ed[k]=$('eg').lastElementChild}
const tr=cls['e'+k]=='tr',bd=cls['e'+k]=='bad',l=ST.ed[k];l.setAttribute('stroke',tr?'var(--ok)':bd?'var(--bad)':'var(--bd)');l.setAttribute('stroke-width',tr||bd?3.5:2)});
ids.forEach(k=>{if(!ST.el[k]){$('ng').insertAdjacentHTML('beforeend',`<g><circle r="16" class="nd"/><text class="tx" text-anchor="middle" dominant-baseline="central">${k}</text><text class="bf" x="19" y="-15"></text></g>`);ST.el[k]=$('ng').lastElementChild;ST.p[k]=from[k]||[0,0]}
const g=ST.el[k],c=cls[k]||'';g.children[0].setAttribute('class','nd '+c);g.children[1].setAttribute('class','tx '+c);g.children[2].textContent=lab[k]??''})}
function place(){for(const k in ST.el)ST.el[k].setAttribute('transform',`translate(${ST.p[k][0]},${ST.p[k][1]})`);
for(const k in ST.ed){const[a,b]=k.split('|'),A=ST.p[a],B=ST.p[b],l=ST.ed[k];if(A&&B){l.setAttribute('x1',A[0]);l.setAttribute('y1',A[1]);l.setAttribute('x2',B[0]);l.setAttribute('y2',B[1])}}}
function mv(tg,ms,my){const s={};for(const k in tg)s[k]=(ST.p[k]||tg[k]).slice();return tw(ms,my,e=>{for(const k in tg)ST.p[k]=[s[k][0]+(tg[k][0]-s[k][0])*e,s[k][1]+(tg[k][1]-s[k][1])*e];place()})}
async function tour(pts,my){if(pts.length<2)return;const tk=$('tk');tk.setAttribute('cx',pts[0][0]);tk.setAttribute('cy',pts[0][1]);tk.style.opacity=1;
for(let j=1;j<pts.length;j++){const a=pts[j-1],b=pts[j];await tw(450,my,e=>{tk.setAttribute('cx',a[0]+(b[0]-a[0])*e);tk.setAttribute('cy',a[1]+(b[1]-a[1])*e)});if(my!=gen){tk.style.opacity=0;return}}
await wait(200);tk.style.opacity=0}
function clr(note){halt();gen++;ST=null;S=[];$('vw').innerHTML='';$('chips').innerHTML='';$('side').innerHTML='';$('nt').textContent=note||'';$('ct').textContent='';$('sl').max=0;$('sl').value=0}
const MODS=[
{u:'Unit 1: Sets and relations',t:'Relations: properties and closure',f:relBar},
{u:'Unit 3: Logic',t:'Truth table builder',f:ttUI},
{u:'Unit 5: Trees and graphs',t:'BST and AVL trees',f:avlUI},
{u:'Unit 5: Trees and graphs',t:'Graph traversal: BFS and DFS',f:bfsUI}];
function showHome(){halt();$('mod').hidden=true;$('home').hidden=false;let h='',u='';
MODS.forEach((m,k)=>{if(m.u!=u){u=m.u;h+=`<h2>${u}</h2>`}h+=`<div class="r"><button style="width:100%;text-align:left" onclick="openMod(${k})">${m.t}</button></div>`});
$('home').innerHTML=h+'<p class="m">Type an input, then step through the solution with Prev, Play and Next.</p>'}
function openMod(k){$('home').hidden=true;$('mod').hidden=false;$('mt').textContent=MODS[k].t;MODS[k].f()}

let zc=0;
const mtx=(C,cl,e)=>{zc=0;return '<table><tr><th></th>'+C.map((_,j)=>`<th>${j+1}</th>`).join('')+'</tr>'+C.map((r,a)=>`<tr><th>${a+1}</th>`+r.map((v,b)=>{const c=cl[a+','+b];return `<td class="${c?c+' an ':''}${v?'o':'z'}"${e?` onclick="flip(${a},${b})" style="cursor:pointer"`:c?` style="animation-delay:${zc++*80}ms"`:''}>${v}</td>`}).join('')+'</tr>').join('')+'</table>'};
function relBar(){
$('inp').innerHTML=`<div class="r"><span class="m">Elements</span>${[3,4,5].map(k=>`<button class="${k==n?'on':''}" onclick="relSz(${k})">${k}</button>`).join('')}</div><div class="r"><button onclick="relRun(0)">Check properties</button><button onclick="relRun(1)">Warshall closure</button><button onclick="relEdit()">Edit</button></div>`;relEdit()}
function relSz(k){n=k;M=chain(k);relBar()}
function relEdit(){clr('Tap cells to toggle 0 or 1 (1 means a R b). Then pick a check.');$('vw').innerHTML=mtx(M,{},true)}
function flip(a,b){M[a][b]^=1;$('vw').innerHTML=mtx(M,{},true)}
function relRun(w){load(w?wst(M):pst(M),d=>{$('vw').innerHTML=mtx(d.C,d.cl,false);return wait(zc*80+600)})}
function pst(M){
const n=M.length,k=(a,b)=>a+','+b,st=[],pr=[];
for(let a=0;a<n;a++)for(let b=0;b<n;b++)pr.push([a,b]);
const add=(c,bd,note)=>{const cl={};c.forEach(x=>cl[k(...x)]='op');bd.forEach(x=>cl[k(...x)]='bad');st.push({C:M,cl,note})};
const ones=pr.filter(p=>M[p[0]][p[1]]),L=p=>`(${p[0]+1},${p[1]+1})`;
st.push({C:M,cl:{},note:'M[a][b] = 1 means a R b. We test four properties, one at a time.'});
const dg=pr.filter(p=>p[0]==p[1]),dm=dg.filter(p=>!M[p[0]][p[1]]),rf=!dm.length;
add(dg,dm,rf?'Reflexive: every (a,a) is 1, so the whole diagonal is ones.':'Not reflexive: '+dm.map(L).join(', ')+' missing (red).');
const sy=ones.filter(p=>!M[p[1]][p[0]]);
add(ones,sy.flatMap(p=>[p,[p[1],p[0]]]),sy.length?`Not symmetric: ${L(sy[0])} is in R but ${L([sy[0][1],sy[0][0]])} is not.`:'Symmetric: every (a,b) in R also has (b,a) in R.');
const as=ones.filter(p=>p[0]<p[1]&&M[p[1]][p[0]]);
add(ones,as.flatMap(p=>[p,[p[1],p[0]]]),as.length?`Not antisymmetric: ${L(as[0])} and ${L([as[0][1],as[0][0]])} are both in R, but the elements differ.`:'Antisymmetric: no two different elements point at each other.');
let tv=null;
for(const[a,b]of ones){for(let c=0;c<n;c++)if(M[b][c]&&!M[a][c]){tv=[a,b,c];break}if(tv)break}
add(tv?[[tv[0],tv[1]],[tv[1],tv[2]]]:ones,tv?[[tv[0],tv[2]]]:[],tv?`Not transitive: ${L([tv[0],tv[1]])} and ${L([tv[1],tv[2]])} are in R but ${L([tv[0],tv[2]])} is not.`:'Transitive: whenever (a,b) and (b,c) are in R, (a,c) is in R too.');
const sm=!sy.length,am=!as.length,tr=!tv;
st.push({C:M,cl:{},note:'Result: '+(rf&&sm&&tr?'an equivalence relation (reflexive, symmetric, transitive).':rf&&am&&tr?'a partial order (reflexive, antisymmetric, transitive).':`reflexive ${rf?'yes':'no'}, symmetric ${sm?'yes':'no'}, antisymmetric ${am?'yes':'no'}, transitive ${tr?'yes':'no'}.`)});
return st}
function wst(M){
const n=M.length,C=M.map(r=>r.slice()),st=[{C:M.map(r=>r.slice()),cl:{},note:'Warshall: for each middle element k, if a to k and k to b exist, add a to b.'}];
for(let k=0;k<n;k++){const nw=[],cl={};
for(let a=0;a<n;a++)for(let b=0;b<n;b++)if(C[a][k]&&C[k][b]&&!C[a][b]){C[a][b]=1;nw.push([a,b])}
for(let t=0;t<n;t++){cl[t+','+k]='op';cl[k+','+t]='op'}
nw.forEach(p=>{cl[p[0]+','+p[1]]='nw'});
st.push({C:C.map(r=>r.slice()),cl,note:`Middle element ${k+1}: `+(nw.length?nw.map(q=>`${q[0]+1} to ${k+1} and ${k+1} to ${q[1]+1} exist, so add (${q[0]+1},${q[1]+1})`).join('; ')+'.':'no new pairs.')})}
st[n].note+=' This is the transitive closure.';return st}

const SY={'&':'∧','|':'∨','>':'→','=':'↔'};
const RULE={'!':'¬ flips the value (T becomes F)','&':'∧ is true only when both inputs are true','|':'∨ is false only when both inputs are false','>':'→ is false only when the first is true and the second is false','=':'↔ is true when both sides match'};
function parse(s){
let p=0;const pk=()=>s[p];
const iff=()=>{let l=imp();while(pk()=='='){p++;l={o:'=',a:l,b:imp()}}return l};
const imp=()=>{const l=or();if(pk()=='>'){p++;return{o:'>',a:l,b:imp()}}return l};
const or=()=>{let l=and();while(pk()=='|'){p++;l={o:'|',a:l,b:and()}}return l};
const and=()=>{let l=nt();while(pk()=='&'){p++;l={o:'&',a:l,b:nt()}}return l};
const nt=()=>{if(pk()=='!'){p++;return{o:'!',a:nt()}}return at()};
const at=()=>{const c=pk();if(c=='('){p++;const e=iff();if(pk()!=')')throw 0;p++;return e}if(c&&/[A-Za-z]/.test(c)){p++;return{o:'v',n:c}}throw 0};
const r=iff();if(p<s.length)throw 0;return r}
const ts=x=>x.o=='v'?x.n:x.o=='!'?'¬'+ts(x.a):'('+ts(x.a)+SY[x.o]+ts(x.b)+')';
const lab=x=>{const s=ts(x);return x.o=='v'||x.o=='!'?s:s.slice(1,-1)};
const ev=(x,e)=>{if(x.o=='v')return e[x.n];if(x.o=='!')return !ev(x.a,e);const a=ev(x.a,e),b=ev(x.b,e);return x.o=='&'?a&&b:x.o=='|'?a||b:x.o=='>'?(!a||b):a==b};
function walk(x,vs,sb){if(x.o=='v'){if(!vs.includes(x.n))vs.push(x.n);return}walk(x.a,vs,sb);if(x.b)walk(x.b,vs,sb);const k=lab(x);if(!sb.some(y=>y.k==k))sb.push({n:x,k})}
function ttUI(){
$('inp').innerHTML=`<div class="r"><input type="text" id="ex" value="(p->q)&amp;!r" autocapitalize="off" autocomplete="off" style="flex:1;min-width:150px;width:auto" oninput="$('er').textContent=''"><button onclick="ttSolve()">Solve</button></div><div class="r">${['¬','∧','∨','→','↔','(',')'].map(c=>`<button onclick="$('ex').value+='${c}'">${c}</button>`).join('')}</div><div id="er" class="er"></div>`;clr();ttSolve()}
function ttSolve(){
halt();const er=$('er');
const s=$('ex').value.replace(/\s/g,'').replace(/<->|↔/g,'=').replace(/->|→/g,'>').replace(/¬|~/g,'!').replace(/∧|&&/g,'&').replace(/∨|\|\|/g,'|');
if(!s){er.textContent='Enter a formula first';return}
let t,vs=[],sb=[];
try{t=parse(s);walk(t,vs,sb)}catch(e){er.textContent='That formula is not valid. Example: (p->q)&!r';return}
if(!sb.length){er.textContent='Use at least one operator, for example p&q';return}
if(vs.length>4){er.textContent='Use at most 4 variables';return}
vs.sort();
const m=vs.length,R=1<<m,hd=vs.concat(sb.map(y=>y.k)),rows=[];

function kmT(n,ones,cl){const rb=n>2?2:1,G=k=>k==1?['0','1']:['00','01','11','10'],R=G(rb),C=G(n-rb);
return `<table><tr><th>${'ABCD'.slice(0,rb)}\\${'ABCD'.slice(rb,n)}</th>`+C.map(c=>`<th>${c}</th>`).join('')+'</tr>'+R.map(r=>`<tr><th>${r}</th>`+C.map(c=>{const m=parseInt(r+c,2),k=cl[m];return `<td class="${k?k+' an ':''}${ones.has(m)?'o':'z'}">${ones.has(m)?1:0}<br><small>${m}</small></td>`}).join('')+'</tr>').join('')+'</table>'}
function kmRun(){
const er=$('er'),n=kv,N=1<<n,ms=[...new Set($('km').value.split(/[,\s]+/).filter(Boolean).map(Number))].sort((a,b)=>a-b);
if(!ms.length||ms.some(m=>!Number.isInteger(m)||m<0||m>=N)){er.textContent=`Enter minterm numbers from 0 to ${N-1}, like 0,1,5`;return}
const ones=new Set(ms),V='ABCD'.slice(0,n),cb=[];
for(let mk=0;mk<N;mk++)for(let v=0;v<N;v++){if(v&mk)continue;const cov=[];for(let m=0;m<N;m++)if((m&~mk)==v)cov.push(m);if(cov.every(m=>ones.has(m)))cb.push({mk,v,cov})}
const PI=cb.filter(p=>!cb.some(q=>q.cov.length>p.cov.length&&p.cov.every(m=>q.cov.includes(m)))),sel=[],es=new Set(),rest=new Set(ms);
ms.forEach(m=>{const c=PI.filter(p=>p.cov.includes(m));if(c.length==1&&!sel.includes(c[0])){sel.push(c[0]);es.add(c[0])}});
sel.forEach(p=>p.cov.forEach(m=>rest.delete(m)));
while(rest.size){const b=PI.filter(p=>!sel.includes(p)).sort((x,y)=>y.cov.filter(m=>rest.has(m)).length-x.cov.filter(m=>rest.has(m)).length)[0];sel.push(b);b.cov.forEach(m=>rest.delete(m))}
const tt=p=>[...V].map((c,j)=>{const b=n-1-j;return p.mk>>b&1?'':c+(p.v>>b&1?'':"'")}).join('')||'1',tl=[];
const st=[{cl:{},f:'',note:`${n} variables, ${N} cells. Each cell shows its minterm number; 1 means F is true. Neighbouring cells differ in one variable, and the edges wrap around.`}];
sel.forEach((p,k)=>{const cl={};sel.slice(0,k).forEach(q=>q.cov.forEach(m=>{cl[m]='op'}));p.cov.forEach(m=>{cl[m]='nw'});tl.push(tt(p));
st.push({cl,f:tl.join(' + '),note:`Group ${k+1}: ${p.cov.length} cells (${p.cov.join(', ')})${es.has(p)?', essential because it alone covers a 1':''}. Variables that change inside the group drop out, so the term is ${tt(p)}.`})});
const al={};ms.forEach(m=>{al[m]='op'});
st.push({cl:al,f:tl.join(' + '),note:`Result: F = ${tl.join(' + ')}. ${sel.length} group${sel.length>1?'s':''} cover all ${ms.length} ones.`});
load(st,d=>{$('vw').innerHTML=kmT(n,ones,d.cl);$('side').innerHTML=d.f?`<b>F =</b> ${d.f}`:'';return wait(450)})}

function grUI(){
$('inp').innerHTML=`<div class="r"><span class="m">n</span><input type="text" id="gn" value="6" style="width:64px"><button onclick="grRun(0)">Integers mod n, add</button><button onclick="grRun(1)">Units mod n, multiply</button></div><div id="er" class="er"></div>`;clr();grRun(0)}
function grRun(u){
const nn=+$('gn').value,er=$('er');
if(!Number.isInteger(nn)||nn<2||nn>20){er.textContent='Use a whole number from 2 to 20';return}
const gd=(a,b)=>b?gd(b,a%b):a,G=[...Array(nn).keys()].filter(a=>!u||gd(a,nn)==1),op=(a,b)=>u?a*b%nn:(a+b)%nn,e=u?1:0,sy=u?'×':'+';
const inv=a=>G.find(b=>op(a,b)==e),od=a=>{let x=a,k=1;while(x!=e){x=op(x,a);k++}return k},gn=G.filter(a=>od(a)==G.length);
const cl=g=>{const s=new Set(g);let c=1;while(c){c=0;for(const a of[...s])for(const b of[...s]){const x=op(a,b);if(!s.has(x)){s.add(x);c=1}}}return[...s].sort((x,y)=>x-y)};
const H=[],K=new Set(),ad=g=>{const c=cl(g),k=c.join();if(!K.has(k)){K.add(k);H.push(c)}};
ad([e]);G.forEach(a=>{ad([a]);G.forEach(b=>ad([a,b]))});ad(G);H.sort((a,b)=>a.length-b.length);
const tb=d=>`<table class="${G.length>10?'sm':''}"><tr><th>${sy}</th>`+G.map(b=>`<th>${b}</th>`).join('')+'</tr>'+G.map((a,r)=>`<tr><th>${a}</th>`+G.map((b,c)=>{const k=d.cl(a,b,op(a,b));return `<td class="${k?k+' ':''}${d.an?'an':''}"${d.an?` style="animation-delay:${(r+c)*50}ms"`:''}>${d.sh?op(a,b):''}</td>`}).join('')+'</tr>').join('')+'</table>';
const z=()=>'',st=[{sh:0,cl:z,side:'',note:`G = {${G.join(', ')}} under ${u?'multiplication':'addition'} mod ${nn}. The table will hold a ${sy} b for every pair of elements.`},
{sh:1,an:1,cl:z,side:'',note:`Closure: every answer is again in G, so ${sy} is a binary operation on G (and it is associative).`},
{sh:1,cl:(a,b)=>a==e||b==e?'op':'',side:'',note:`Identity e = ${e}: its row and column just repeat the headings (blue).`},
{sh:1,cl:(a,b,v)=>v==e?'nw':'',side:'',note:`Inverses: wherever the answer is ${e} (yellow), the two headings are inverses. ${G.map(a=>`${a}⁻¹ = ${inv(a)}`).join(', ')}.`},
{sh:1,cl:z,side:G.map(a=>`<span class="chip${gn.includes(a)?' nw':''}">${a}: order ${od(a)}</span>`).join(' '),note:`Order of an element = smallest k with a^k = ${e}. `+(gn.length?`Generators (order ${G.length}, yellow): ${gn.join(', ')}. One element generates all of G, so G is cyclic.`:`No element has order ${G.length}, so G is not cyclic.`)}];
H.slice(0,8).forEach(h=>{const cs=[],sn=new Set();G.forEach(a=>{if(!sn.has(a)){const c=h.map(x=>op(a,x)).sort((x,y)=>x-y);c.forEach(x=>sn.add(x));cs.push(c)}});
st.push({sh:1,cl:(a,b)=>h.includes(a)&&h.includes(b)?'op':'',side:'<b>Left cosets aH:</b> '+cs.map((c,k)=>`<span class="chip" style="background:hsl(${k*67+20},75%,78%);color:#1f1e1c">{${c.join(', ')}}</span>`).join(' '),note:`Subgroup H = {${h.join(', ')}} of order ${h.length} (blue block). Lagrange: ${cs.length} cosets × ${h.length} elements = ${G.length}, so ${h.length} divides ${G.length}.`})});
load(st,d=>{$('vw').innerHTML=tb(d);$('side').innerHTML=d.side;return wait(d.an?G.length*100+500:300)})}

function gcUI(){
$('inp').innerHTML=`<input type="text" id="ge" value="1-2,2-3,3-4,4-1,1-3" placeholder="A-B, B-C or 1-2, 2-3" autocomplete="off" oninput="$('er').textContent=''"><div class="r"><button onclick="gcRun(0)">Colouring</button><button onclick="gcRun(1)">Bipartite?</button><button onclick="gcRun(2)">Euler path</button></div><div id="er" class="er"></div>`;clr();gcRun(0)}
function gcRun(w){
const er=$('er'),g=gp($('ge').value,10);
if(g.err){er.textContent=g.err;return}
if(!g.E.length||(w==2&&g.V.some(v=>!g.E.some(e=>e.includes(v))))){er.textContent=g.E.length?'For an Euler path every vertex must touch an edge. Remove the lone vertex.':'Enter at least one edge, like A-B.';return}
const E=g.E,V=g.V.slice().sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
const adj={},ed=[],P={},dg={},st=[],c={};V.forEach(v=>{adj[v]=[]});
E.forEach(([a,b])=>{if(!adj[a].includes(b)){adj[a].push(b);adj[b].push(a);ed.push([a,b])}});
V.forEach((v,j)=>{const t=2*Math.PI*j/V.length-Math.PI/2;P[v]=[170+105*Math.cos(t),125+95*Math.sin(t)];dg[v]=adj[v].length});
const ek=(a,b)=>ed.find(x=>(x[0]==a&&x[1]==b)||(x[0]==b&&x[1]==a)).join('|');
if(w==0){
st.push({fill:{},cls:{},lab:dg,note:'Colour the vertices so that touching ones differ. Small numbers are degrees. We colour from the highest degree to the lowest.'});
V.slice().sort((a,b)=>dg[b]-dg[a]).forEach(v=>{const us=[...new Set(adj[v].filter(u=>c[u]!==undefined).map(u=>c[u]))];let k=0;while(us.includes(k))k++;c[v]=k;
st.push({fill:{...c},cls:{[v]:'new'},lab:{},note:`Vertex ${v}: its neighbours already use ${us.length?'colour '+us.map(x=>x+1).join(', '):'no colours'}, so ${v} gets colour ${k+1}.`})});
const t=Math.max(...Object.values(c))+1;
st.push({fill:{...c},cls:{},lab:{},note:`All vertices are coloured with ${t} colour${t>1?'s':''}, so the chromatic number is at most ${t}. Greedy gives an upper bound, not always the minimum.`})}
else if(w==1){let bd=null;
for(const s of V){if(c[s]!==undefined)continue;c[s]=0;const q=[s];st.push({fill:{...c},cls:{[s]:'new'},lab:{},note:`Start at ${s} and put it in set 1 (orange).`});
while(q.length&&!bd){const v=q.shift();for(const u of adj[v]){if(c[u]===undefined){c[u]=1-c[v];q.push(u);st.push({fill:{...c},cls:{[u]:'new'},lab:{},note:`${u} touches ${v}, so it goes in the other set (${c[u]?'blue':'orange'}).`})}else if(c[u]==c[v]){bd=[v,u];break}}}
if(bd)break}
st.push(bd?{fill:{...c},cls:{[bd[0]]:'bad',[bd[1]]:'bad'},lab:{},tr:[ek(...bd)],note:`${bd[0]} and ${bd[1]} touch but sit in the same set. That closes an odd cycle, so the graph is not bipartite.`}:{fill:{...c},cls:{},lab:{},note:'Every edge joins set 1 to set 2, so the graph is bipartite (no odd cycle).'})}
else{const od=V.filter(v=>dg[v]%2),sn=new Set([V[0]]),q=[V[0]];
while(q.length){const v=q.pop();adj[v].forEach(u=>{if(!sn.has(u)){sn.add(u);q.push(u)}})}
const cn=sn.size==V.length,oc={};od.forEach(v=>{oc[v]='bad'});
st.push({fill:{},cls:{},lab:dg,note:'Small numbers are degrees (edges meeting at a vertex). An Euler path uses every edge exactly once.'});
st.push({fill:{},cls:oc,lab:dg,note:`Odd-degree vertices (red): ${od.length?od.join(', '):'none'}. `+(!cn?'The graph is not connected, so there is no Euler path.':od.length==0?'Connected with all degrees even: an Euler circuit exists.':od.length==2?'Connected with exactly two odd vertices: an Euler path exists between them.':'More than two odd vertices: there is no Euler path or circuit.')});
if(cn&&od.length<3){const A={};V.forEach(v=>{A[v]=adj[v].slice()});const s=od[0]||V[0],sk=[s],pa=[];
while(sk.length){const v=sk[sk.length-1];if(A[v].length){const u=A[v].pop();A[u].splice(A[u].indexOf(v),1);sk.push(u)}else pa.push(sk.pop())}
pa.reverse();st.push({fill:{},cls:{[s]:'ok'},lab:dg,trail:pa,note:`Euler ${od.length?'path':'circuit'}: ${pa.join(' → ')}. The token walks it edge by edge.`})}}
load(st,async d=>{const mine=gen,cls={...d.cls};(d.tr||[]).forEach(k=>{cls['e'+k]='tr'});
if(!ST){stage(340,250);DG()}sync(V,ed,cls,d.lab||{},P);place();dk(cls);
V.forEach(v=>{const f=d.fill[v],g=ST.el[v].children;g[0].style.fill=f===undefined?'':PL[f];g[1].style.fill=f===undefined?'':'#fff'});
if(d.trail)await tour(d.trail.map(v=>ST.p[v]||P[v]),mine);else await wait(500)})}

function pgUI(){
$('inp').innerHTML=`<div class="r"><span class="m">Pigeons</span><input type="text" id="pn" value="11" style="width:64px"><span class="m">Holes</span><input type="text" id="pk" value="4" style="width:64px"><button onclick="pgRun()">Drop</button></div><div id="er" class="er"></div>`;clr();pgRun()}
function pgRun(){
const n=+$('pn').value,k=+$('pk').value,er=$('er');
if(!Number.isInteger(n)||!Number.isInteger(k)||n<1||n>24||k<1||k>8){er.textContent='Use 1 to 24 pigeons and 1 to 8 holes';return}
const hs=Array.from({length:k},()=>[]),cm=Math.ceil(n/k),sn=()=>hs.map(a=>a.slice()),st=[{hs:sn(),h:-1,note:`${n} pigeons must fit into ${k} holes. We drop them one at a time into a hole with the fewest pigeons.`}];
for(let p=1;p<=n;p++){const h=hs.reduce((b,a,j)=>a.length<hs[b].length?j:b,0);hs[h].push(p);
st.push({hs:sn(),h,note:`Pigeon ${p} goes to hole ${h+1}. `+(p<=k?'That hole was empty.':p==k+1?'Every hole already has a pigeon, so one hole must now hold two. This is the pigeonhole principle.':`Holes now hold ${hs.map(a=>a.length).join(', ')}.`)})}
st.push({hs:sn(),h:-1,fin:1,note:n>k?`Even the fairest spread leaves a hole with at least ⌈${n}/${k}⌉ = ${cm} pigeons. If every hole held at most ${cm-1}, the total would be at most ${k*(cm-1)}, which is less than ${n}.`:`${n} ≤ ${k}, so every pigeon can have its own hole. A shared hole is forced only when pigeons outnumber holes.`});
load(st,d=>{const mx=Math.max(...d.hs.map(a=>a.length));
$('vw').innerHTML='<div class="hl">'+d.hs.map((a,j)=>`<div><div class="hb ${d.fin&&n>k&&a.length==mx?'op':''}">`+a.map((p,q)=>`<span class="chip${j==d.h&&q==a.length-1?' nw an':''}">${p}</span>`).join('')+`</div><div class="m" style="text-align:center">Hole ${j+1}</div></div>`).join('')+'</div>';return wait(600)})}

function gp(s,max){
const T=s.replace(/\s*(->|→|–|—)\s*/g,'-').replace(/\s*-\s*/g,'-').split(/[,;\s]+/).filter(Boolean),E=[],V=[];
for(const t of T){const p=t.split('-');
if(p.length>2||p.some(x=>!/^\w{1,6}$/.test(x)))return{E,V,err:`"${t}" is not valid. Write edges like A-B or 1-2 (letters or digits, up to 6 characters).`};
if(p.length==2&&p[0]==p[1])return{E,V,err:`"${t}" is a self-loop (a vertex joined to itself). Use two different vertices.`};
p.forEach(x=>{if(!V.includes(x))V.push(x)});
if(p.length==2&&!E.some(e=>(e[0]==p[0]&&e[1]==p[1])||(e[0]==p[1]&&e[1]==p[0])))E.push(p)}
if(!V.length)return{E,V,err:'Enter some edges, for example A-B, B-C, C-A.'};
if(V.length>max)return{E,V,err:`Use at most ${max} vertices (you entered ${V.length}).`};
return{E,V,err:''}}

(function f(t,y){if(!t)return;dm=Math.max(dm,y);eu.push([t.id,0]);f(t.l,y+1);eu.push([t.id,1]);P[t.id]=[20+xi++*40,y*58+26];ids.push(t.id);f(t.r,y+1);eu.push([t.id,2]);if(t.l)ed.push([t.id,t.l.id]);if(t.r)ed.push([t.id,t.r.id])})(nd[0],0);

function spRun(w){
const er=$('er'),g=gw($('we').value);if(g.err){er.textContent=g.err;return}
const{E,W,V}=g,s0=$('ws').value,K=(a,b)=>E.find(e=>(e[0]==a&&e[1]==b)||(e[0]==b&&e[1]==a)).join('|'),wt=(a,b)=>W[K(a,b)],adj={},P={};

V.forEach((v,j)=>{const t=2*Math.PI*j/V.length-Math.PI/2;P[v]=[170+105*Math.cos(t),125+95*Math.sin(t)]});
const st=[],tr=[],rj=[],col={},lab={},snap=note=>st.push({tr:tr.slice(),rj:rj.slice(),col:{...col},lab:{...lab},note});let tot=0;
